<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get support for Swayve.">
  <title>Support — Swayve</title>
  <style>
    :root { color-scheme:light; --ink:#251d35; --muted:#71677d; --line:#e4ddf1; --accent:#7257d9; --dark:#2f2352; --paper:#fff; --wash:#f8f5ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { padding:64px 24px 50px; background:linear-gradient(135deg,var(--dark),#513c88); color:#fff; }
    .wrap { max-width:820px; margin:0 auto; }
    .eyebrow { margin:0 0 8px; color:#ddd2ff; font-size:13px; font-weight:750; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.3rem); line-height:1.1; letter-spacing:-.04em; }
    header p:last-child { margin:18px 0 0; color:#e7e0fa; }
    main { padding:36px 24px 72px; }
    article { padding:clamp(26px,5vw,52px); background:var(--paper); border:1px solid var(--line); border-radius:20px; box-shadow:0 14px 38px #392a680d; }
    h2 { margin:0 0 10px; color:var(--dark); font-size:1.35rem; line-height:1.25; }
    p { margin:0 0 22px; }
    form { display:grid; gap:18px; }
    label { display:grid; gap:7px; font-weight:650; }
    input, textarea { width:100%; border:1px solid #c9bedc; border-radius:10px; padding:12px 13px; color:var(--ink); background:#fff; font:inherit; }
    input:focus, textarea:focus { outline:3px solid #ddd2ff; border-color:var(--accent); }
    textarea { min-height:170px; resize:vertical; }
    button { justify-self:start; border:0; border-radius:10px; padding:12px 20px; background:var(--accent); color:#fff; font:inherit; font-weight:750; cursor:pointer; }
    button:hover { background:#5d43c1; }
    .back { display:inline-block; margin-bottom:22px; color:var(--accent); font-weight:650; text-decoration:none; }
    .back:hover, .back:focus-visible { text-decoration:underline; text-underline-offset:4px; }
    .direct { margin:28px 0 0; padding-top:22px; border-top:1px solid var(--line); color:var(--muted); }
    a { color:var(--accent); font-weight:650; }
    footer { padding:0 24px 36px; color:var(--muted); font-size:.9rem; text-align:center; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">Swayve</p>
      <h1>Support</h1>
      <p>Tell us how we can help.</p>
    </div>
  </header>

  <main>
    <article class="wrap">
      <a class="back" href="marketing.html">← Back to Swayve</a>
      <h2>Contact support</h2>
      <p>Complete the form below and your email app will open with the message addressed to <a href="mailto:cjjian@gmail.com">cjjian@gmail.com</a>.</p>

      <form id="support-form">
        <label for="name">Name <input id="name" name="name" autocomplete="name" required></label>
        <label for="email">Email address <input id="email" name="email" type="email" autocomplete="email" required></label>
        <label for="subject">Subject <input id="subject" name="subject" required></label>
        <label for="message">Message <textarea id="message" name="message" required></textarea></label>
        <button type="submit">Open email</button>
      </form>

      <p class="direct">You can also email us directly at <a href="mailto:cjjian@gmail.com">cjjian@gmail.com</a>.</p>
    </article>
  </main>

  <footer>© 2026 Jian Chen. All rights reserved.</footer>

  <script>
    document.getElementById('support-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const subject = encodeURIComponent('[Swayve] ' + form.get('subject'));
      const body = encodeURIComponent(
        'Name: ' + form.get('name') + '\n' +
        'Reply email: ' + form.get('email') + '\n\n' +
        form.get('message')
      );
      window.location.href = 'mailto:cjjian@gmail.com?subject=' + subject + '&body=' + body;
    });
  </script>
</body>
</html>
